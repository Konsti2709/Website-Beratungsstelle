<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vielen Dank | Aufwind Beratung</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/header.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="stylesheet" href="css/success.css" />
  </head>

  <body data-page="success">
    <main>
      <section class="success">
        <div class="success-card">
          <div class="success-icon" data-icon="circleCheck" aria-hidden="true"></div>

          <h1 data-text="success_Hero_title">
            Termin erfolgreich gebucht
          </h1>

          <p
            id="success-intro"
            data-text="success_Hero_intro"
          >
            Vielen Dank — Ihre Buchung wurde gespeichert.
          </p>

          <div class="booking-details">
            <p>
              <strong data-text="success_Buchungsdetails_service_label">
                Leistung:
              </strong>

              <span id="booking-service">—</span>
            </p>

            <p>
              <strong data-text="success_Buchungsdetails_datetime_label">
                Datum &amp; Uhrzeit:
              </strong>

              <span id="booking-datetime">—</span>
            </p>
          </div>

          <p class="success-note" id="success-note">
            <span class="success-note-icon" data-icon="mail" aria-hidden="true"></span>
            <span data-text="success_Bestätigung_note">Sie erhalten in Kürze eine Bestätigung per E-Mail.</span>
          </p>

          <a
            href="index.html"
            class="btn btn-primary"
            data-text="success_CTA_button"
          >
            Zur Startseite
          </a>
        </div>
      </section>
    </main>

    <script src="js/load-components.js"></script>
    <script src="js/header.js"></script>
    <script src="js/content-loader.js"></script>
    <script type="module" src="js/public-icons.js"></script>

    <script>
      // Parse query params und fülle die Erfolgseite
      (function () {
        const params = new URLSearchParams(window.location.search);

        const service = params.get("service");
        const date = params.get("date");
        const time = params.get("time");

        if (service) {
          document.getElementById("booking-service").textContent =
            decodeURIComponent(service);
        }

        if (date || time) {
          const formattedDate = date
            ? new Date(`${date}T${time || "00:00"}`).toLocaleDateString("de-DE", {
                weekday: "long",
                day: "numeric",
                month: "long",
                year: "numeric",
              })
            : "";
          const formattedTime = time ? `${time} Uhr` : "";
          const dateTime = [formattedDate, formattedTime].filter(Boolean).join(" um ");

          document.getElementById("booking-datetime").textContent = dateTime;
        }

        // If no params, show a generic message
        if (!service && !date && !time) {
          document.getElementById("success-intro").textContent =
            "Ihre Buchung wurde verarbeitet. Weitere Details finden Sie in Ihrem Posteingang.";
        }
      })();
    </script>
  </body>
</html>
