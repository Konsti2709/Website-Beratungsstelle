<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Verfügbarkeit | Aufwind Beratung</title>

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="../../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <link rel="stylesheet" href="../css/availability.css" />
  </head>

  <body>
    <div class="admin-layout" id="adminLayout">

      <div id="adminSidebarContainer"></div>

      <!-- ========================================
           MAIN
           ======================================== -->

      <main class="admin-main">

        <!-- ========================================
             TOPBAR
             ======================================== -->

        <header class="admin-topbar">

          <div class="topbar-left">

            <button
              type="button"
              class="mobile-menu-button"
              id="mobileMenuButton"
              aria-label="Menü öffnen"
              aria-expanded="false"
            >
              <span></span>
              <span></span>
              <span></span>
            </button>


            <div class="topbar-title">

              <h1>
                Verfügbarkeit
              </h1>

              <p>
                Reguläre Arbeitszeiten verwalten
              </p>

            </div>

          </div>


          <div class="topbar-right">

            <div class="admin-user">

              <div class="admin-user-avatar">
                A
              </div>


              <div class="admin-user-info">

                <span
                  class="admin-user-name"
                  id="adminUserName"
                >
                  Administrator
                </span>

                <span class="admin-user-role">
                  Admin
                </span>

              </div>

            </div>

          </div>

        </header>


        <!-- ========================================
             CONTENT
             ======================================== -->

        <section class="availability-content">

          <!-- ========================================
               HEADER
               ======================================== -->

          <div class="availability-header">

            <div>

              <h2>
                Reguläre Arbeitszeiten
              </h2>

              <p>
                Lege fest, wann Termine regulär
                gebucht werden können.
              </p>

            </div>

          </div>


          <!-- ========================================
               WOCHENTAGE
               ======================================== -->

          <div
            id="availability-days"
            class="availability-days"
          >

            <!-- Wird per JavaScript eingefügt -->

          </div>


          <!-- ========================================
               SPEICHERN
               ======================================== -->

          <div class="availability-actions">

            <div
              id="availability-message"
              class="availability-message"
              hidden
              role="status"
              aria-live="polite"
            ></div>

            <button
              type="button"
              class="availability-save"
              id="save-availability"
            >
              <span data-icon="save" aria-hidden="true"></span>
              Änderungen speichern
            </button>

          </div>

        </section>

      </main>

    </div>


    <!-- ========================================
         JAVASCRIPT
         ======================================== -->

    <script
      type="module"
      src="../js/auth.js"
    ></script>

    <script type="module" src="../js/admin-layout.js"></script>

    <script
      type="module"
      src="../js/availability.js"
    ></script>

  </body>
</html>
